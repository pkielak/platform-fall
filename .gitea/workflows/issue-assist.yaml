name: Issue Assist
on:
  issue_comment:
    types: [created]

jobs:
  assist:
    runs-on: pi-sandbox
    if: contains(gitea.event.comment.body, '@pi') && !gitea.event.is_pull
    steps:
      - uses: actions/checkout@v4

      - name: Respond
        run: |
          PROMPT=$(echo "${{ gitea.event.comment.body }}" | sed 's/@pi[[:space:]]*//')

          pi -p "You are assisting with issue #${{ gitea.event.issue.number }}:
          Title: ${{ gitea.event.issue.title }}
          Body: ${{ gitea.event.issue.body }}

          User asked: $PROMPT

          Help them concisely. If it's a command, do it. Reference specific files and line numbers where relevant."