name: Issue Assist
on:
  issue_comment:
    types: [created]

jobs:
  assist:
    runs-on: pi-sandbox
    if: contains(gitea.event.comment.body, '@pi') && !gitea.event.is_pull
    steps:
      - uses: actions/checkout@v4

      - name: Debug
        run: |
          cat /root/.pi/agent/settings.json
          cat /root/.pi/agent/models.json
          pi --list-models

      - name: Respond
        run: |
          PROMPT=$(echo "${{ gitea.event.comment.body }}" | sed 's/@pi[[:space:]]*//')

          pi --mode json "You are assisting with issue #${{ gitea.event.issue.number }}:
          Title: ${{ gitea.event.issue.title }}
          Body: ${{ gitea.event.issue.body }}

          User asked: $PROMPT

          Help them concisely. If it's a command, do it. If you ended work with new commit, push the work and create a PR if it dont exist yet and report back in the comment. Reference specific files and line numbers where relevant." 2>/dev/null | jq -rs '
            reduce .[] as $e ({out: ""};
              if $e.type == "message_update" then
              if .assistantMessageEvent.type == "text_delta" then
                .out += $e.assistantMessageEvent.delta
              elif .assistantMessageEvent.type == "thinking_start" then
                .out += "\n  \u2514 thinking"
              elif .assistantMessageEvent.type == "toolcall_start" then
                .out += "\n  \u2514 \($e.assistantMessageEvent.toolName)"
              else . end
              elif $e.type == "tool_execution_end" and $e.isError then
                .out += "\n  \u2717 \($e.toolName) failed"
              else . end
            ) | .out
          '